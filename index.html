<!DOCTYPE html>
<html lang="vi"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bè Gỗ – Biển và Bè</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;background:#0b2a3d;overflow:hidden;touch-action:none;font-family:system-ui,-apple-system,sans-serif}
canvas{display:block;position:fixed;inset:0;width:100%;height:100%}
#hud{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);padding:12px 14px;color:#fff;text-shadow:0 1px 4px #0009;font-size:13px;line-height:1.4;pointer-events:none}
#hud b{font-size:15px}
#js{position:fixed;width:90px;height:90px;margin:-45px 0 0 -45px;border-radius:50%;border:2px solid #fff8;background:#fff2;display:none;pointer-events:none}
#js i{position:absolute;left:50%;top:50%;width:36px;height:36px;margin:-18px;border-radius:50%;background:#fffb}
</style></head><body>
<div id="hud"><b>Bè Gỗ · Biển và Bè</b><br>Kéo nửa màn hình bên trái để đi, bên phải để nhìn quanh.</div>
<div id="js"><i></i></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const SENS = 0.005; // độ nhạy nhìn (sau này nối vào Cài đặt)
const R = new THREE.WebGLRenderer({antialias:true});
R.setPixelRatio(Math.min(devicePixelRatio,2));
document.body.appendChild(R.domElement);
const S = new THREE.Scene();
S.background = new THREE.Color(0x9fd8f0);
S.fog = new THREE.Fog(0x9fd8f0, 30, 150);
const C = new THREE.PerspectiveCamera(70,1,0.1,400);
C.rotation.order = 'YXZ';
S.add(new THREE.HemisphereLight(0xffffff,0x2a6f9a,0.95));
const sun = new THREE.DirectionalLight(0xfff2cc,0.9);
sun.position.set(40,60,20); S.add(sun);
const sunBall = new THREE.Mesh(new THREE.SphereGeometry(7,16,16), new THREE.MeshBasicMaterial({color:0xfff6c8,fog:false}));
sunBall.position.set(120,90,60); S.add(sunBall);

// Biển
const wg = new THREE.PlaneGeometry(320,320,90,90); wg.rotateX(-Math.PI/2);
const wp = wg.attributes.position;
S.add(new THREE.Mesh(wg,new THREE.MeshPhongMaterial({color:0x1f8fc9,flatShading:true,shininess:80,specular:0x88ccff})));
// Sóng êm dần quanh bè (d<5) nên nước không tràn lên bè
const wave=(x,z,t)=>{const d=Math.hypot(x,z),f=Math.min(1,Math.max(0,(d-5)/9));return f*f*(Math.sin(x*.25+t)*.35+Math.sin(z*.3+t*1.3)*.3+Math.sin((x+z)*.12+t*.7)*.5);};

// Mây
const cm = new THREE.MeshBasicMaterial({color:0xffffff,fog:false});
for(let i=0;i<10;i++){
  const g=new THREE.Group();
  for(let k=0;k<3;k++){const s=new THREE.Mesh(new THREE.SphereGeometry(5+Math.random()*4,8,6),cm);s.position.set(k*7,Math.random()*2,Math.random()*3);s.scale.y=.45;g.add(s);}
  const a=Math.random()*6.28,d=80+Math.random()*60;
  g.position.set(Math.cos(a)*d,45+Math.random()*20,Math.sin(a)*d); S.add(g);
}

// Bè gỗ
const raft = new THREE.Group(); S.add(raft);
const wood=[0x9a6b3c,0x8b5e34,0xa87746].map(c=>new THREE.MeshLambertMaterial({color:c}));
for(let i=0;i<3;i++)for(let j=0;j<3;j++)for(let k=0;k<4;k++){
  const p=new THREE.Mesh(new THREE.BoxGeometry(1.9,.18,.44),wood[(i+j+k)%3]);
  p.position.set(i*2-2,0,j*2-2+(k-1.5)*.48); raft.add(p);
}
const drum=new THREE.MeshLambertMaterial({color:0x3c6e91});
[[-2.4,-2.4],[2.4,-2.4],[-2.4,2.4],[2.4,2.4],[0,-2.4],[0,2.4]].forEach(([x,z])=>{
  const b=new THREE.Mesh(new THREE.CylinderGeometry(.55,.55,1.3,10),drum);
  b.rotation.x=Math.PI/2; b.position.set(x,-.35,z); raft.add(b);
});
const pole=new THREE.Mesh(new THREE.CylinderGeometry(.06,.07,3,6),wood[1]);
pole.position.set(-2.6,1.5,-2.6); raft.add(pole);
const flag=new THREE.Mesh(new THREE.PlaneGeometry(1,.6),new THREE.MeshLambertMaterial({color:0xe8553d,side:THREE.DoubleSide}));
flag.position.set(-2.1,2.6,-2.6); raft.add(flag);
raft.add(C); C.position.set(0,1.7,0);

// Thùng gỗ trôi
const crates=[];
const cmat=new THREE.MeshLambertMaterial({color:0xb98550});
for(let i=0;i<6;i++){
  const m=new THREE.Mesh(new THREE.BoxGeometry(1,1,1),cmat);
  m.add(new THREE.LineSegments(new THREE.EdgesGeometry(m.geometry),new THREE.LineBasicMaterial({color:0x5a3a1a})));
  const a=Math.random()*6.28,d=10+Math.random()*25;
  m.position.set(Math.cos(a)*d,0,Math.sin(a)*d);
  m.userData={vx:(Math.random()-.5)*.4,vz:(Math.random()-.5)*.4,ph:Math.random()*6};
  S.add(m); crates.push(m);
}

// Điều khiển
let yaw=0,pitch=-0.05,mx=0,mz=0;
const keys={};
addEventListener('keydown',e=>keys[e.code]=1);
addEventListener('keyup',e=>keys[e.code]=0);
const js=document.getElementById('js'),knob=js.firstElementChild;
const T={}; // touch theo id
addEventListener('touchstart',e=>{
  for(const t of e.changedTouches){
    if(t.clientX<innerWidth/2){T[t.identifier]={m:1,x:t.clientX,y:t.clientY};
      js.style.display='block';js.style.left=t.clientX+'px';js.style.top=t.clientY+'px';}
    else T[t.identifier]={m:0,x:t.clientX,y:t.clientY};
  }
},{passive:false});
addEventListener('touchmove',e=>{
  e.preventDefault();
  for(const t of e.changedTouches){
    const o=T[t.identifier]; if(!o)continue;
    if(o.m){
      let dx=(t.clientX-o.x)/45,dy=(t.clientY-o.y)/45,l=Math.hypot(dx,dy);
      if(l>1){dx/=l;dy/=l;}
      mx=dx;mz=dy; knob.style.transform=`translate(${dx*30}px,${dy*30}px)`;
    }else{
      yaw-=(t.clientX-o.x)*SENS; pitch-=(t.clientY-o.y)*SENS;
      o.x=t.clientX;o.y=t.clientY;
    }
  }
},{passive:false});
const endT=e=>{for(const t of e.changedTouches){const o=T[t.identifier];
  if(o&&o.m){mx=mz=0;js.style.display='none';knob.style.transform='';} delete T[t.identifier];}};
addEventListener('touchend',endT);addEventListener('touchcancel',endT);
let drag=false;
addEventListener('mousedown',()=>drag=true);
addEventListener('mouseup',()=>drag=false);
addEventListener('mousemove',e=>{if(drag){yaw-=e.movementX*SENS;pitch-=e.movementY*SENS;}});

function resize(){R.setSize(innerWidth,innerHeight);C.aspect=innerWidth/innerHeight;C.updateProjectionMatrix();}
addEventListener('resize',resize);resize();

// Vòng lặp
const clock=new THREE.Clock();
function loop(){
  const dt=Math.min(clock.getDelta(),.05),t=clock.elapsedTime;
  for(let i=0;i<wp.count;i++)wp.setY(i,wave(wp.getX(i),wp.getZ(i),t));
  wp.needsUpdate=true;
  raft.position.y=.3+Math.sin(t*1.2)*.04;
  raft.rotation.z=Math.sin(t*.9)*.015;
  raft.rotation.x=Math.cos(t*.7)*.015;
  flag.rotation.y=Math.sin(t*3)*.25;
  pitch=Math.max(-1.3,Math.min(1.3,pitch));
  C.rotation.set(pitch,yaw,0);
  let ix=mx+(keys.KeyD?1:0)-(keys.KeyA?1:0), iz=mz+(keys.KeyS?1:0)-(keys.KeyW?1:0);
  const sp=2.6*dt,c=Math.cos(yaw),s=Math.sin(yaw);
  C.position.x=Math.max(-2.7,Math.min(2.7,C.position.x+(ix*c+iz*s)*sp));
  C.position.z=Math.max(-2.7,Math.min(2.7,C.position.z+(-ix*s+iz*c)*sp));
  crates.forEach(m=>{
    const u=m.userData;m.position.x+=u.vx*dt;m.position.z+=u.vz*dt;
    m.position.y=wave(m.position.x,m.position.z,t)*.8+.1;
    m.rotation.z=Math.sin(t+u.ph)*.15;m.rotation.x=Math.cos(t*.8+u.ph)*.12;
  });
  R.render(S,C);requestAnimationFrame(loop);
}
loop();
</script></body></html>
